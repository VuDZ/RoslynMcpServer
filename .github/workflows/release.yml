name: Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA already on main (empty = selected branch HEAD)'
        required: false
        type: string
      force:
        description: 'Allow a release when the tree vs the previous tag is docs/rules only'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  meta:
    runs-on: windows-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      archives: ${{ steps.meta.outputs.archives }}
      sc_zip: ${{ steps.meta.outputs.sc_zip }}
      fdd_zip: ${{ steps.meta.outputs.fdd_zip }}
    steps:
      - name: Resolve SHA
        id: rev
        shell: pwsh
        run: |
          $sha = '${{ inputs.commit_sha }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($sha)) {
            $sha = '${{ github.sha }}'
          }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.rev.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch origin/main
        run: git fetch origin main --tags --force

      - name: Release metadata
        id: meta
        shell: pwsh
        run: |
          ./.github/scripts/Get-ReleaseMetadata.ps1 `
            -CommitRef HEAD `
            -NotesPath "${{ github.workspace }}/release-notes.md" `
            -GitHubOutput $env:GITHUB_OUTPUT

      - name: Guard
        shell: pwsh
        run: |
          $onMain = '${{ steps.meta.outputs.on_origin_main }}'
          $docsOnly = '${{ steps.meta.outputs.docs_only }}'
          $force = '${{ inputs.force }}'
          if ($onMain -ne 'True' -and $onMain -ne 'true') {
            throw "SHA ${{ steps.meta.outputs.sha }} is not on origin/main. Push that commit first."
          }
          if (($docsOnly -eq 'True' -or $docsOnly -eq 'true') -and $force -ne 'true') {
            throw "Docs/rules-only changes since the previous tag. Re-run with force=true only if a binary release is still intended."
          }

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  tests:
    needs: meta
    uses: ./.github/workflows/test-suite.yml
    with:
      ref: ${{ needs.meta.outputs.sha }}

  pack:
    needs: [meta, tests]
    name: pack (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # A later RID is another include row plus one entry in Get-ReleaseArchives.
          - rid: win-x64
            os: windows-latest
            format: zip
            runtime: coreclr.dll
            host: RoslynMcpServer.exe
          - rid: linux-x64
            os: ubuntu-latest
            format: tar.gz
            runtime: libcoreclr.so
            host: RoslynMcpServer
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.meta.outputs.sha }}

      # AR-13: one exact SDK builds the release, so a rebuild of the same tag uses the same compiler and
      # targets. Only the release checkout gets this global.json: the server reads global.json to choose
      # MSBuild and does not honor rollForward yet (AR-18), so a permissive pin in the repository would make
      # it report false SDK mismatches. Raise the version here when a newer SDK is wanted.
      - name: Pin the release SDK
        shell: pwsh
        run: Set-Content -LiteralPath global.json -Value '{"sdk":{"version":"10.0.402","rollForward":"disable"}}'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Restore
        run: dotnet restore RoslynMcpServer.sln

      - name: Publish, pack, and smoke
        shell: pwsh
        env:
          ARCHIVES: ${{ needs.meta.outputs.archives }}
        run: |
          $version = '${{ needs.meta.outputs.version }}'
          $rid = '${{ matrix.rid }}'
          $format = '${{ matrix.format }}'
          $runtimeName = '${{ matrix.runtime }}'
          $hostName = '${{ matrix.host }}'
          $expected = @($env:ARCHIVES.Split(',') | Where-Object { $_ -like "*-$rid-*" })
          if ($expected.Count -ne 2) {
            throw "Release metadata does not list two archives for $rid. Got: $env:ARCHIVES"
          }

          $root = '${{ github.workspace }}'
          $project = Join-Path $root '.github/smoke/SmokeApp/SmokeApp.csproj'
          $zipDir = Join-Path $root 'artifacts/archives'
          New-Item -ItemType Directory -Path $zipDir -Force | Out-Null

          foreach ($kind in @('self-contained', 'framework-dependent')) {
            $selfContained = $(if ($kind -eq 'self-contained') { 'true' } else { 'false' })
            $out = Join-Path $root "artifacts/publish/$rid-$kind"
            New-Item -ItemType Directory -Path $out -Force | Out-Null
            dotnet publish RoslynMcpServer.csproj -c Release -r $rid --self-contained $selfContained -o $out --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $dll = Join-Path $out 'RoslynMcpServer.dll'
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dll)
            $product = $info.ProductVersion.Split('+', 2)[0].Trim()
            if ($product -notlike "$version*") {
              throw "ProductVersion '$($info.ProductVersion)' on $dll does not match csproj Version $version."
            }

            $runtime = Join-Path $out $runtimeName
            $hasRuntime = Test-Path -LiteralPath $runtime
            if ($selfContained -eq 'true' -and -not $hasRuntime) {
              throw "Self-contained publish is missing ${runtimeName}: $out"
            }
            if ($selfContained -eq 'false' -and $hasRuntime) {
              throw "Framework-dependent publish must not include ${runtimeName}: $out"
            }

            $archiveName = "RoslynMcpServer-$version-$rid-$kind.$format"
            if ($expected -notcontains $archiveName) {
              throw "Packed name $archiveName is not in the release metadata."
            }
            $archive = Join-Path $zipDir $archiveName
            ./.github/scripts/New-PublishZip.ps1 -PublishDir $out -ZipPath $archive -Format $format -HostFileName $hostName

            $smokeRoot = Join-Path $root "artifacts/smoke/$rid-$kind"
            New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
            if ($format -eq 'zip') {
              Expand-Archive -LiteralPath $archive -DestinationPath $smokeRoot
            }
            else {
              & tar -xzf $archive -C $smokeRoot
              if ($LASTEXITCODE -ne 0) { throw "Could not unpack $archive" }
            }
            $hostPath = Join-Path $smokeRoot "RoslynMCP/$hostName"
            ./.github/scripts/Invoke-ReleaseSmoke.ps1 -HostPath $hostPath -ProjectPath $project
          }

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.rid }}
          path: artifacts/archives/*
          if-no-files-found: error

  release:
    needs: [meta, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.meta.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: publish-*
          path: release-assets
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes

      - name: Require every metadata archive
        shell: pwsh
        env:
          ARCHIVES: ${{ needs.meta.outputs.archives }}
        run: |
          $missing = @()
          foreach ($name in $env:ARCHIVES.Split(',')) {
            $found = @(Get-ChildItem -LiteralPath release-assets -Recurse -Filter $name -File)
            if ($found.Count -ne 1) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            throw "Release is missing archives: $($missing -join ', ')"
          }

      - name: Attest release archives
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-assets/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVES: ${{ needs.meta.outputs.archives }}
        shell: pwsh
        run: |
          $tag = '${{ needs.meta.outputs.tag }}'
          $sha = '${{ needs.meta.outputs.sha }}'
          $version = '${{ needs.meta.outputs.version }}'
          $notes = Join-Path (Get-Location) 'release-notes/release-notes.md'
          $files = @()
          foreach ($name in $env:ARCHIVES.Split(',')) {
            $found = @(Get-ChildItem -LiteralPath release-assets -Recurse -Filter $name -File)
            $files += $found[0].FullName
          }

          $tagExists = $false
          & git rev-parse -q --verify "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $tagExists = $true
            $tagSha = (git rev-list -n 1 $tag).Trim()
            if ($tagSha -ne $sha) {
              throw "Tag $tag already points to $tagSha, not $sha."
            }
          }

          $releaseJson = & gh release view $tag --json isDraft,isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "GitHub Release $tag is already published. Refusing to replace it."
            }

            gh release upload $tag @files --clobber
            gh release edit $tag --draft=false --target $sha --title $version --notes-file $notes
            Write-Host "Published existing draft $tag"
            return
          }

          if ($tagExists) {
            Write-Host "Tag $tag already exists on $sha; creating release from existing tag."
          }

          gh release create $tag @files --target $sha --title $version --notes-file $notes
