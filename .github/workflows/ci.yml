name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos-shard:
        description: 'macOS ARM64 shard to run'
        type: choice
        default: tia-integration
        options:
          - unit
          - tia-integration
          - lifecycle

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test-suite.yml
    with:
      macos-shard: ${{ inputs.macos-shard || '' }}
