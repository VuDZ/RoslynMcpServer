name: Test suite

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA to test (empty = caller github.sha)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.shard }} (${{ matrix.runner }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runner: windows
            shard: unit
            timeout: 20
            # RequiresPinnedSdk: fixtures of the deferred workspace-load-cache experiment (SDK 10.0.300 exactly).
            filter: 'Category!=AnalyzerLifecycle&Category!=RequiresPinnedSdk'
          - os: windows-latest
            runner: windows
            shard: lifecycle
            timeout: 20
            filter: Category=AnalyzerLifecycle
            lifecycleOptIn: '1'
          - os: ubuntu-latest
            runner: ubuntu
            shard: unit
            timeout: 20
            # RequiresWindows is the task-01 inventory. A filter exclusion is not a TRX skip.
            filter: 'Category!=AnalyzerLifecycle&Category!=RequiresWindows&Category!=RequiresPinnedSdk'
          - os: ubuntu-latest
            runner: ubuntu
            shard: lifecycle
            timeout: 20
            filter: Category=AnalyzerLifecycle
            lifecycleOptIn: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # The fixtures that pin SDK 10.0.300 exactly are in RequiresPinnedSdk and not run here; the
          # latest 10.0.x alone once failed them: https://github.com/VuDZ/RoslynMcpServer/actions/runs/37148534996
          # Tests do not need a reproducible SDK; the release pins its own (release.yml, AR-13).
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Restore
        run: dotnet restore RoslynMcpServer.sln

      # ROSLYN_MCP_ANALYZER_LIFECYCLE is the suite's own opt-in gate: it is unset for `unit` and set
      # for `lifecycle` only. The host tests skip without it, and the skip then fails this job.
      - name: Test
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}-${{ matrix.runner }}
          FILTER: ${{ matrix.filter }}
          ROSLYN_MCP_ANALYZER_LIFECYCLE: ${{ matrix.lifecycleOptIn }}
        run: |
          dotnet test RoslynMcpServer.sln `
            -c Release `
            --no-restore `
            --verbosity normal `
            --logger "trx;LogFileName=$env:SHARD.trx" `
            --results-directory "${{ github.workspace }}/TestResults" `
            --filter "$env:FILTER"

      - name: Fail if any test skipped
        shell: pwsh
        run: ./.github/scripts/Assert-NoSkippedTests.ps1 -ResultsDirectory "${{ github.workspace }}/TestResults"

      - name: Upload TRX
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-${{ matrix.shard }}-${{ matrix.runner }}
          path: TestResults/**
          if-no-files-found: error
