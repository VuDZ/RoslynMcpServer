name: Test suite

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA to test (empty = caller github.sha)'
        type: string
        required: false
        default: ''
      macos-tia-only:
        description: 'Run only the macOS ARM64 TIA integration shard'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.shard }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner == 'macos-arm64' && 'macos-15' || format('{0}-latest', matrix.runner) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ inputs.macos-tia-only && fromJSON('["macos-arm64"]') || fromJSON('["windows", "ubuntu", "macos-arm64"]') }}
        shard: ${{ inputs.macos-tia-only && fromJSON('["tia-integration"]') || fromJSON('["unit", "tia-integration", "lifecycle"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # The fixtures that pin SDK 10.0.300 exactly are in RequiresPinnedSdk and not run here; the
          # latest 10.0.x alone once failed them: https://github.com/VuDZ/RoslynMcpServer/actions/runs/37148534996
          # Tests do not need a reproducible SDK; the release pins its own (release.yml, AR-13).
          dotnet-version: 10.0.x
          architecture: ${{ matrix.runner == 'macos-arm64' && 'arm64' || 'x64' }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Restore
        run: dotnet restore RoslynMcpServer.sln

      - name: Build
        run: dotnet build RoslynMcpServer.sln -c Release --no-restore

      # The shorter macOS step timeout leaves time to upload diagnostics before the job times out.
      # ROSLYN_MCP_ANALYZER_LIFECYCLE is the host tests' opt-in gate and is set only for `lifecycle`.
      - name: Test
        shell: pwsh
        timeout-minutes: ${{ matrix.runner == 'macos-arm64' && matrix.shard != 'lifecycle' && 16 || 20 }}
        env:
          SHARD: ${{ matrix.shard }}-${{ matrix.runner }}
          TEST_SHARD: ${{ matrix.shard }}
          TEST_RUNNER: ${{ matrix.runner }}
          RESULTS_DIRECTORY: ${{ github.workspace }}/TestResults
          ROSLYN_MCP_ANALYZER_LIFECYCLE: ${{ matrix.shard == 'lifecycle' && '1' || '' }}
        run: |
          $filter = 'Category=AnalyzerLifecycle'
          if ($env:TEST_SHARD -ne 'lifecycle') {
            # Some deferred workspace-load-cache fixtures require SDK 10.0.300 exactly.
            $filter = 'Category!=AnalyzerLifecycle&Category!=RequiresPinnedSdk'
            if ($env:TEST_RUNNER -ne 'windows') {
              $filter += '&Category!=RequiresWindows'
            }
            if ($env:TEST_SHARD -eq 'tia-integration') {
              $filter += '&Category=TiaIntegration'
            } else {
              $filter += '&Category!=TiaIntegration'
            }
          }

          $useWatchdog = $env:SHARD -eq 'tia-integration-macos-arm64'
          $diagnosticArgs = @()
          if ($env:TEST_RUNNER -eq 'macos-arm64' -and $env:TEST_SHARD -ne 'lifecycle') {
            New-Item -ItemType Directory -Force -Path $env:RESULTS_DIRECTORY | Out-Null
            $diagnosticArgs = @('--diag', (Join-Path $env:RESULTS_DIRECTORY "$env:SHARD.vstest.log"))
            if ($useWatchdog) {
              # Keep the testhost alive for the external watchdog to sample on a hang.
              $diagnosticArgs += '--blame'
            } else {
              $diagnosticArgs += @('--blame-hang-timeout', '5m', '--blame-hang-dump-type', 'none')
            }
          }
          $testArgs = @(
            'test', 'RoslynMcpServer.sln', '-c', 'Release', '--no-build', '--verbosity', 'normal',
            '--logger', "trx;LogFileName=$env:SHARD.trx", '--results-directory', $env:RESULTS_DIRECTORY,
            '--filter', $filter
          ) + $diagnosticArgs
          if ($useWatchdog) {
            python3 ./.github/scripts/run-macos-tia.py dotnet @testArgs
          } else {
            dotnet @testArgs
          }
          exit $LASTEXITCODE

      - name: Fail if any test skipped
        shell: pwsh
        run: ./.github/scripts/Assert-NoSkippedTests.ps1 -ResultsDirectory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-${{ matrix.shard }}-${{ matrix.runner }}
          path: TestResults/**
          if-no-files-found: error
