name: Test suite

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA to test (empty = caller github.sha)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            timeout: 20
            filter: Category!=AnalyzerLifecycle
          - name: lifecycle
            timeout: 20
            filter: Category=AnalyzerLifecycle
            lifecycleOptIn: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Restore
        run: dotnet restore RoslynMcpServer.sln

      # ROSLYN_MCP_ANALYZER_LIFECYCLE is the suite's own opt-in gate: it is unset for `unit` and set
      # for `lifecycle` only. The host tests skip without it, and the skip then fails this job.
      - name: Test
        shell: pwsh
        env:
          SHARD: ${{ matrix.name }}
          FILTER: ${{ matrix.filter }}
          ROSLYN_MCP_ANALYZER_LIFECYCLE: ${{ matrix.lifecycleOptIn }}
        run: |
          dotnet test RoslynMcpServer.sln `
            -c Release `
            --no-restore `
            --verbosity normal `
            --logger "trx;LogFileName=$env:SHARD.trx" `
            --results-directory "${{ github.workspace }}/TestResults" `
            --filter "$env:FILTER"

      - name: Fail if any test skipped
        shell: pwsh
        run: .\.github\scripts\Assert-NoSkippedTests.ps1 -ResultsDirectory "${{ github.workspace }}\TestResults"

      - name: Upload TRX
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-${{ matrix.name }}
          path: TestResults/**
          if-no-files-found: error
