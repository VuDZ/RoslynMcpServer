name: Test suite

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit SHA to test (empty = caller github.sha)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.shard }} (${{ matrix.runner }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runner: windows
            architecture: x64
            shard: unit
            timeout: 20
            # RequiresPinnedSdk: fixtures of the deferred workspace-load-cache experiment (SDK 10.0.300 exactly).
            filter: 'Category!=AnalyzerLifecycle&Category!=RequiresPinnedSdk&Category!=TiaIntegration'
          - os: windows-latest
            runner: windows
            architecture: x64
            shard: tia-integration
            timeout: 20
            filter: 'Category!=AnalyzerLifecycle&Category!=RequiresPinnedSdk&Category=TiaIntegration'
          - os: windows-latest
            runner: windows
            architecture: x64
            shard: lifecycle
            timeout: 20
            filter: Category=AnalyzerLifecycle
            lifecycleOptIn: '1'
          - os: ubuntu-latest
            runner: ubuntu
            architecture: x64
            shard: unit
            timeout: 20
            # RequiresWindows is the task-01 inventory. A filter exclusion is not a TRX skip.
            filter: 'Category!=AnalyzerLifecycle&Category!=RequiresWindows&Category!=RequiresPinnedSdk&Category!=TiaIntegration'
          - os: ubuntu-latest
            runner: ubuntu
            architecture: x64
            shard: tia-integration
            timeout: 20
            filter: 'Category!=AnalyzerLifecycle&Category!=RequiresWindows&Category!=RequiresPinnedSdk&Category=TiaIntegration'
          - os: ubuntu-latest
            runner: ubuntu
            architecture: x64
            shard: lifecycle
            timeout: 20
            filter: Category=AnalyzerLifecycle
            lifecycleOptIn: '1'
          - os: macos-15
            runner: macos-arm64
            architecture: arm64
            shard: unit
            timeout: 20
            testTimeout: 16
            filter: 'Category!=AnalyzerLifecycle&Category!=RequiresWindows&Category!=RequiresPinnedSdk&Category!=TiaIntegration'
          - os: macos-15
            runner: macos-arm64
            architecture: arm64
            shard: tia-integration
            timeout: 20
            testTimeout: 16
            filter: 'Category!=AnalyzerLifecycle&Category!=RequiresWindows&Category!=RequiresPinnedSdk&Category=TiaIntegration'
          - os: macos-15
            runner: macos-arm64
            architecture: arm64
            shard: lifecycle
            timeout: 20
            filter: Category=AnalyzerLifecycle
            lifecycleOptIn: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # The fixtures that pin SDK 10.0.300 exactly are in RequiresPinnedSdk and not run here; the
          # latest 10.0.x alone once failed them: https://github.com/VuDZ/RoslynMcpServer/actions/runs/37148534996
          # Tests do not need a reproducible SDK; the release pins its own (release.yml, AR-13).
          dotnet-version: 10.0.x
          architecture: ${{ matrix.architecture }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Restore
        run: dotnet restore RoslynMcpServer.sln

      - name: Build
        run: dotnet build RoslynMcpServer.sln -c Release --no-restore

      # The shorter macOS step timeout leaves time to upload diagnostics before the job times out.
      # ROSLYN_MCP_ANALYZER_LIFECYCLE is the host tests' opt-in gate and is set only for `lifecycle`.
      - name: Test
        shell: pwsh
        timeout-minutes: ${{ matrix.testTimeout || matrix.timeout }}
        env:
          SHARD: ${{ matrix.shard }}-${{ matrix.runner }}
          FILTER: ${{ matrix.filter }}
          RESULTS_DIRECTORY: ${{ github.workspace }}/TestResults
          DIAGNOSE_HANGS: ${{ matrix.runner == 'macos-arm64' && matrix.shard != 'lifecycle' }}
          ROSLYN_MCP_ANALYZER_LIFECYCLE: ${{ matrix.lifecycleOptIn }}
        run: |
          $diagnosticArgs = @()
          if ($env:DIAGNOSE_HANGS -eq 'true') {
            New-Item -ItemType Directory -Force -Path $env:RESULTS_DIRECTORY | Out-Null
            $diagnosticArgs = @(
              '--diag', (Join-Path $env:RESULTS_DIRECTORY "$env:SHARD.vstest.log"),
              '--blame-hang-timeout', '5m', '--blame-hang-dump-type', 'none'
            )
          }
          dotnet test RoslynMcpServer.sln `
            -c Release `
            --no-build `
            --verbosity normal `
            --logger "trx;LogFileName=$env:SHARD.trx" `
            --results-directory "$env:RESULTS_DIRECTORY" `
            --filter "$env:FILTER" `
            @diagnosticArgs

      - name: Fail if any test skipped
        shell: pwsh
        run: ./.github/scripts/Assert-NoSkippedTests.ps1 -ResultsDirectory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-${{ matrix.shard }}-${{ matrix.runner }}
          path: TestResults/**
          if-no-files-found: error
