name: Build

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.mdc"
      - "docs/**"
      - ".cursor/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.mdc"
      - "docs/**"
      - ".cursor/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore RoslynMcpServer.sln

      - name: Build
        run: dotnet build RoslynMcpServer.sln -c Release --no-restore --no-incremental

      - name: Publish win-x64
        shell: pwsh
        run: ./publish-and-verify.ps1 -SkipKill

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/RoslynMCP-*.zip
          if-no-files-found: error
          archive: false
          retention-days: 14
